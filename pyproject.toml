[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-football"
version = "0.1.0"
description = "Causal pre-match football forecasting research"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4", "pandas==3.1.0", "pyarrow==26.0.0", "duckdb==2.0.0",
    "scipy==1.18.1", "scikit-learn==1.9.1", "threadpoolctl==3.7.0", "catboost==1.2.10",
]

[project.optional-dependencies]
notebook = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
